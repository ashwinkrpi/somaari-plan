<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 846" width="640" height="846" role="img" aria-labelledby="title desc">
  <title id="title">How somaari-plan works</title>
  <desc id="desc">The browser sends JSON to Waitress and Flask. Plans pass through mdparse and date and time rules, then the AI mode decides the next step: TypeSafe Jev for jev, the LLM chain for llm, or straight on for off. All three reach the Scheduler, which writes to SQLite. Waitress and Flask also read and write SQLite directly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a3a3a3"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .box { fill: #171717; stroke: #3a3a3a; stroke-width: 2; }
      .accent { fill: #0b0b0b; stroke: #ff4f00; stroke-width: 2; }
      .name { fill: #ffffff; font-size: 19px; font-weight: 600; }
      .sub { fill: #d4d4d4; font-size: 15px; }
      .label { fill: #a3a3a3; font-size: 14px; text-anchor: start; }
      .flow { fill: none; stroke: #a3a3a3; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="640" height="846" rx="16" fill="#0b0b0b"/>

  <!-- Flows -->
  <path class="flow" d="M295 84 V138"/>
  <path class="flow" d="M295 192 V230"/>
  <path class="flow" d="M295 296 V334"/>
  <path class="flow" d="M295 400 V438"/>
  <path class="flow" d="M112 488 V546"/>
  <path class="flow" d="M320 488 V546"/>
  <path class="flow" d="M500 488 V670"/>
  <path class="flow" d="M112 632 V670"/>
  <path class="flow" d="M320 632 V670"/>
  <path class="flow" d="M295 724 V762"/>
  <path class="flow" d="M590 192 V762"/>

  <!-- Flow labels -->
  <text class="label" x="307" y="116">JSON /api</text>
  <text class="label" x="124" y="522">jev</text>
  <text class="label" x="332" y="522">llm</text>
  <text class="label" x="512" y="522">off</text>

  <!-- Request path -->
  <rect class="accent" x="30" y="20" width="580" height="64" rx="10"/>
  <text class="name" x="320" y="45">Browser</text>
  <text class="sub" x="320" y="68">HTML · CSS · JS</text>

  <rect class="box" x="30" y="140" width="580" height="52" rx="10"/>
  <text class="name" x="320" y="173">Waitress + Flask</text>

  <rect class="box" x="30" y="232" width="530" height="64" rx="10"/>
  <text class="name" x="295" y="257">mdparse</text>
  <text class="sub" x="295" y="280">headings · lists</text>

  <rect class="box" x="30" y="336" width="530" height="64" rx="10"/>
  <text class="name" x="295" y="361">Rules</text>
  <text class="sub" x="295" y="384">dates · times</text>

  <rect class="accent" x="30" y="440" width="530" height="48" rx="10"/>
  <text class="name" x="295" y="471">AI mode</text>

  <!-- AI branches -->
  <rect class="box" x="30" y="548" width="165" height="84" rx="10"/>
  <text class="name" x="112" y="581">TypeSafe Jev</text>
  <text class="sub" x="112" y="605">typed questions</text>

  <rect class="box" x="205" y="548" width="230" height="84" rx="10"/>
  <text class="name" x="320" y="572">LLM chain</text>
  <text class="sub" x="320" y="596">OpenRouter · Gemini</text>
  <text class="sub" x="320" y="617">OpenAI-compatible</text>

  <!-- Result -->
  <rect class="box" x="30" y="672" width="530" height="52" rx="10"/>
  <text class="name" x="295" y="705">Scheduler</text>

  <rect class="accent" x="30" y="764" width="580" height="64" rx="10"/>
  <text class="name" x="320" y="789">SQLite</text>
  <text class="sub" x="320" y="812">data/somaari.db</text>
</svg>
